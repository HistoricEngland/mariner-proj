{% load i18n %}
<div class="relative">
    <div class="close-popup-panel-container">
        <span class="close-popup-panel" tabindex="0" role="button" id="latlong-filter-type-close-btn"
            aria-label="{% trans 'Close Filter by Latitude and Longitude' %}"
            data-bind="onEnterkeyClick, onSpaceClick,
                click: function(){selectedPopup(''); $root.shiftFocus('#latlong-filter-type-open-btn');}
        ">{% trans "Filter by Latitude and Longitude" %}</span>
        <div class="btn-group">
            <button class="btn btn-primary btn-active-primary" type="button" data-bind="click: function(){ clear(); }">
                <i class="fa fa-close" aria-hidden="true"></i>
                <span>{% trans "Clear" %}</span>
            </button>
        </div>
    </div>
    <hr class="title-underline">

    <div class="latlong-filter">
        <div class="latlong-filter-field">
            <label class="search-label" for="latlong-filter-longitude">{% trans "Longitude (X)" %}</label>
            <input id="latlong-filter-longitude" class="form-control input-md" type="text" inputmode="decimal"
                aria-describedby="latlong-filter-longitude-error" aria-required="true"
                data-bind="textInput: filter.longitude, attr: {'aria-invalid': !!longitudeError()}">
            <span id="latlong-filter-longitude-error" class="text-danger text-sm" role="alert"
                data-bind="text: longitudeError"></span>
        </div>

        <div class="latlong-filter-field">
            <label class="search-label" for="latlong-filter-latitude">{% trans "Latitude (Y)" %}</label>
            <input id="latlong-filter-latitude" class="form-control input-md" type="text" inputmode="decimal"
                aria-describedby="latlong-filter-latitude-error" aria-required="true"
                data-bind="textInput: filter.latitude, attr: {'aria-invalid': !!latitudeError()}">
            <span id="latlong-filter-latitude-error" class="text-danger text-sm" role="alert"
                data-bind="text: latitudeError"></span>
        </div>

        <div class="latlong-filter-field">
            <label class="search-label" for="latlong-filter-buffer">{% trans "Buffer Radius (m)" %}</label>
            <input id="latlong-filter-buffer" class="form-control input-md" type="text" inputmode="decimal"
                aria-describedby="latlong-filter-buffer-error"
                data-bind="textInput: filter.buffer, attr: {'aria-invalid': !!bufferError()}">
            <span id="latlong-filter-buffer-error" class="text-danger text-sm" role="alert"
                data-bind="text: bufferError"></span>
        </div>

        <div class="latlong-filter-actions">
            <button class="btn btn-primary btn-active-primary" type="button" data-bind="click: function(){ apply(); }">
                <i class="fa fa-check" aria-hidden="true"></i>
                <span>{% trans "Apply" %}</span>
            </button>
        </div>
    </div>
</div>
