{% extends "registration/base.html" %}
{% load i18n %}

{% block title %}{{ app_settings.APP_NAME }} - Password Reset - Complete{% endblock title %}

{% block content %}

<div class="login-form-container">
	<form id="login-form" class="forgot-password-form">
		<fieldset>
			<legend class="arches-signin-subtext">
				{% trans "Password Reset" %}
			</legend>
			<div class="form-group">
				<p>Your password has been set. You may go ahead and <a href="{% url 'auth' %}">log in now</a>.</p>
			</div>
		</fieldset>
	</form>
</div>

{% endblock %}
