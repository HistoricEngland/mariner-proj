<!DOCTYPE html>
<html lang="en">

<head></head>

<body style="font-family:'Source Sans Pro', Arial;">
    <table border="0" width="100%" cellspacing="0" cellpadding="0" bgcolor="#fff" style="padding-bottom:14px;">
        <tbody>
            <tr>
                <td>
                    {% include 'custom_email_header.htm' %}
                    <table border="0" width="100%" cellspacing="0" cellpadding="0" style="padding-bottom:14px;">
                        <tbody>
                            <tr>
                                <td>
                                    <table border="0" width="600" cellspacing="0" cellpadding="0" style="padding-bottom:14px;">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    {% if username != "" %}
                                                        <p>{{salutation}} {{username}},</p>
                                                    {% endif %}
                                                    <p>{{greeting}}</p>
                                                    {% if link != "" %}
                                                        <div>
                                                            <!--[if mso]>
                                                                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                                                                            xmlns:w="urn:schemas-microsoft-com:office:word"
                                                                            href="{{link}}"
                                                                            style="v-text-anchor:middle; width:175px; height:53px;"
                                                                            arcsize="10%"
                                                                            strokecolor="#ffffff"
                                                                            strokeweight="1px"
                                                                            fillcolor="#2579A4">
                                                                            <v:stroke dashstyle="solid"/>
                                                                            <w:anchorlock />
                                                                            <center style="
                                                                                color: #ffffff;
                                                                                display: block;
                                                                                font-family: Arial,Helvetica,sans-serif;
                                                                                font-size: 18px;
                                                                                font-weight: bold;
                                                                                text-decoration: none;
                                                                                text-align: center;
                                                                                direction: ltr;">
                                                                                {{link_text}}
                                                                            </center>
                                                                </v:roundrect>
                                                            <![endif]-->

                                                            <!--[if !mso]><!-- -->
                                                                <a
                                                                    href="{{link}}"
                                                                    target="_blank"
                                                                    role="button"
                                                                    aria-label="Reset Password"
                                                                    style="background-color:rgb(37, 121, 164);border-radius:5px;color:#ffffff;display:inline-block;font-size:18px;font-family:Arial,Helvetica,sans-serif;font-weight:bold;text-align:center;text-decoration:none;width:175px;height:53px;-webkit-text-size-adjust:none;line-height:53px;">
                                                                    {{link_text}}
                                                                </a>
                                                            <!--<![endif]-->
                                                        </div>
                                                    {% endif %}
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    {% include 'custom_email_footer.htm' %}
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
