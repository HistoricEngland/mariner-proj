    #      - mariner-proj-2d344
    #  stdin_open: true
    #  tty: true

    mariner-proj-2d344-livereload:
      profiles:
        - livereload
      container_name: mariner-proj-2d344-livereload
      image: he/mariner_proj-2d344:dev_build
      command: run_livereload
      volumes:
        - ../../arches:/web_root/arches
        - ../../mariner-proj:/web_root/mariner_proj
      env_file:
        - ./docker/env_file.env
      ports:
        - 35729:35729      
      depends_on:
          - mariner-proj-2d344
      stdin_open: true
      tty: true
    
    mariner-proj-2d344-webpack:
      container_name: mariner-proj-2d344-webpack
      image: he/mariner_proj-2d344:dev_build
      command: run_webpack
      volumes:
        - ../../arches:/web_root/arches
        - ../../mariner-proj:/web_root/mariner_proj
      env_file:
        - ./docker/env_file.env
      ports:
        - 8028:8021
      depends_on:
          - mariner-proj-2d344
      stdin_open: true
      tty: true

networks:
  default:
    external: true
    name: mariner-proj-2d344-network

volumes:
    arches-log-2d344:
    arches-static-2d344:
